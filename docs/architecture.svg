<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">SuperShield live AWS architecture</title>
  <desc id="desc">A human reviewer uses the React demo over direct HTTP. A rate-limited nginx gateway on one EC2 instance proxies to FastAPI and a Strands supervisor. Strands coordinates bounded deterministic tools and private Ollama Qwen3 inference. Systems Manager provides administration and EventBridge invokes Lambda to terminate the instance after judging.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:400 15px system-ui,sans-serif;fill:#475569}
      .h{font:700 16px system-ui,sans-serif;fill:#0f172a}.t{font:400 13px system-ui,sans-serif;fill:#334155}
      .box{stroke-width:2;rx:14}.edge{fill:#e8f1ff;stroke:#1456a0}.agent{fill:#e9f8ef;stroke:#157347}
      .tool{fill:#f4ecff;stroke:#6f42c1}.guard{fill:#ffe8e8;stroke:#b42318}.data{fill:#f5f5f5;stroke:#4b5563}.human{fill:#fff4d6;stroke:#8a5a00}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      .zone{fill:#fbfdff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6;rx:18}.label{font:700 13px system-ui,sans-serif;fill:#475569;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="48" class="title">SuperShield · verified judging deployment</text>
  <text x="40" y="76" class="sub">Direct HTTP · curated synthetic cases only · no CloudFront, Bedrock, AgentCore, S3, or DynamoDB</text>

  <rect x="40" y="125" width="220" height="88" class="box human"/>
  <text x="150" y="158" text-anchor="middle" class="h">Human reviewer</text>
  <text x="150" y="182" text-anchor="middle" class="t">constraints + approvals</text>

  <rect x="310" y="125" width="230" height="88" class="box edge"/>
  <text x="425" y="158" text-anchor="middle" class="h">React demo</text>
  <text x="425" y="182" text-anchor="middle" class="t">12 synthetic cases only</text>
  <path d="M260 169 H310" class="line"/>

  <rect x="585" y="100" width="775" height="575" class="zone"/>
  <text x="610" y="130" class="label">AMAZON EC2 · T4G.LARGE · PRIVATE DOCKER NETWORK</text>

  <rect x="620" y="160" width="215" height="95" class="box edge"/>
  <text x="728" y="192" text-anchor="middle" class="h">nginx gateway</text>
  <text x="728" y="216" text-anchor="middle" class="t">public TCP 80 · rate limits</text>
  <text x="728" y="236" text-anchor="middle" class="t">security headers · no TLS</text>
  <path d="M540 169 H620" class="line"/>
  <text x="576" y="154" text-anchor="middle" class="t">HTTP</text>

  <rect x="885" y="160" width="215" height="95" class="box edge"/>
  <text x="992" y="192" text-anchor="middle" class="h">FastAPI BFF</text>
  <text x="992" y="216" text-anchor="middle" class="t">session · SSE · expiry</text>
  <text x="992" y="236" text-anchor="middle" class="t">in-memory state</text>
  <path d="M835 207 H885" class="line"/>

  <rect x="1135" y="160" width="190" height="95" class="box agent"/>
  <text x="1230" y="192" text-anchor="middle" class="h">Strands supervisor</text>
  <text x="1230" y="216" text-anchor="middle" class="t">bounded coordination</text>
  <text x="1230" y="236" text-anchor="middle" class="t">compact receipts</text>
  <path d="M1100 207 H1135" class="line"/>

  <rect x="1135" y="300" width="190" height="90" class="box agent"/>
  <text x="1230" y="332" text-anchor="middle" class="h">Private Ollama</text>
  <text x="1230" y="356" text-anchor="middle" class="t">qwen3:8b-q4_K_M</text>
  <text x="1230" y="376" text-anchor="middle" class="t">one parallel request</text>
  <path d="M1230 255 V300" class="line"/>

  <text x="620" y="310" class="label">AUTHORITATIVE BOUNDED TOOLS</text>
  <rect x="620" y="335" width="210" height="78" class="box tool"/>
  <text x="725" y="367" text-anchor="middle" class="h">Evidence Collector</text>
  <text x="725" y="391" text-anchor="middle" class="t">citations + hashes</text>
  <rect x="865" y="335" width="210" height="78" class="box tool"/>
  <text x="970" y="367" text-anchor="middle" class="h">Skeptic</text>
  <text x="970" y="391" text-anchor="middle" class="t">contradictions + gaps</text>
  <rect x="620" y="450" width="210" height="78" class="box tool"/>
  <text x="725" y="482" text-anchor="middle" class="h">Deterministic Finance</text>
  <text x="725" y="506" text-anchor="middle" class="t">Decimal scenarios</text>
  <rect x="865" y="450" width="210" height="78" class="box tool"/>
  <text x="970" y="482" text-anchor="middle" class="h">Location Risk</text>
  <text x="970" y="506" text-anchor="middle" class="t">synthetic screening</text>
  <path d="M1190 255 C1160 285 1040 305 970 335" class="line"/>
  <path d="M1170 255 C1100 300 830 300 725 335" class="line"/>

  <rect x="700" y="565" width="230" height="78" class="box guard"/>
  <text x="815" y="597" text-anchor="middle" class="h">Evidence Validator</text>
  <text x="815" y="621" text-anchor="middle" class="t">no evidence → unresolved</text>
  <rect x="985" y="565" width="230" height="78" class="box guard"/>
  <text x="1100" y="597" text-anchor="middle" class="h">Human Approval Tool</text>
  <text x="1100" y="621" text-anchor="middle" class="t">payload hash + expiry</text>
  <path d="M725 413 V450" class="line"/><path d="M970 413 V450" class="line"/>
  <path d="M725 528 L785 565" class="line"/><path d="M970 528 L845 565" class="line"/>
  <path d="M930 604 H985" class="line"/>
  <path d="M1215 604 C1285 555 1310 350 1255 255" class="line"/>

  <rect x="65" y="715" width="310" height="92" class="box data"/>
  <text x="220" y="747" text-anchor="middle" class="h">AWS Systems Manager</text>
  <text x="220" y="771" text-anchor="middle" class="t">administration · no SSH</text>
  <text x="220" y="791" text-anchor="middle" class="t">IMDSv2 required</text>
  <path d="M375 760 H585" class="dash"/>

  <rect x="560" y="715" width="300" height="92" class="box guard"/>
  <text x="710" y="747" text-anchor="middle" class="h">Amazon EventBridge</text>
  <text x="710" y="771" text-anchor="middle" class="t">2026-10-16 06:00 UTC cutoff</text>
  <rect x="950" y="715" width="300" height="92" class="box guard"/>
  <text x="1100" y="747" text-anchor="middle" class="h">AWS Lambda</text>
  <text x="1100" y="771" text-anchor="middle" class="t">terminate exact EC2 + root EBS</text>
  <path d="M860 760 H950" class="line"/>
  <path d="M1100 715 V675" class="line"/>

  <text x="40" y="860" class="sub">Decision states support human and expert review; they never authorize purchase, signing, payment, or other real-world action.</text>
</svg>
