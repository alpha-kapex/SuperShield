version: 1.0
runtime: python312
build:
  commands:
    build:
      - python -m pip install .
run:
  runtime-version: 3.12
  command: uvicorn supershield.api:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: SUPERSHIELD_MODE
      value: strands
    - name: SUPERSHIELD_PUBLIC_DEMO
      value: "true"
    - name: SUPERSHIELD_CASE_TTL_SECONDS
      value: "86400"
