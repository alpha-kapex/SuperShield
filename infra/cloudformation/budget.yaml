AWSTemplateFormatVersion: '2010-09-09'
Description: Mandatory SuperShield demo budget notifications

Parameters:
  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'
    Description: Team-owned address that must confirm the AWS Budgets subscription
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 500

Resources:
  DemoBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: supershield-demo-monthly
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - user:Project$SuperShield
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL
