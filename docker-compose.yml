services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      SUPERSHIELD_MODE: local
      SUPERSHIELD_PUBLIC_DEMO: "true"
      SUPERSHIELD_ALLOW_INLINE_DOCUMENTS: "false"
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
